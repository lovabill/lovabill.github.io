<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Εφαρμογή</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .question-container {
            margin-bottom: 30px;
        }

        .question {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            background: #f8f9fa;
            padding: 15px 20px;
            border-radius: 10px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            position: relative;
        }

        .option:hover {
            background: #e9ecef;
            border-color: #667eea;
        }

        .option.correct {
            background: #d4edda;
            border-color: #28a745;
        }

        .option.wrong {
            background: #f8d7da;
            border-color: #dc3545;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .option input[type="radio"] {
            margin-right: 12px;
            cursor: pointer;
            width: 18px;
            height: 18px;
            pointer-events: none;
        }

        .option label {
            cursor: pointer;
            flex: 1;
            font-size: 16px;
            color: #495057;
            pointer-events: none;
        }

        .fact {
            background: #e7f3ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-top: 15px;
            border-radius: 5px;
            font-size: 14px;
            color: #333;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 10px 15px;
            border-radius: 5px;
            margin-top: 15px;
            text-align: center;
            font-weight: 500;
        }

        .button-container {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            text-align: center;
            padding: 30px;
        }

        .score {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }

        .result-message {
            font-size: 20px;
            color: #666;
            margin-bottom: 30px;
        }

        .hidden {
            display: none;
        }

        .progress {
            background: #e9ecef;
            height: 8px;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            transition: width 0.3s ease;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Quiz Εφαρμογή</h1>
        
        <div id="loading" class="loading">
            <p>⏳ Φόρτωση ερωτήσεων...</p>
        </div>

        <div id="quizContainer" class="hidden">
            <div class="progress">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            
            <div id="questionArea"></div>
            
            <div class="button-container">
                <button id="prevBtn" onclick="previousQuestion()" disabled>Προηγούμενο</button>
                <button id="nextBtn" onclick="nextQuestion()">Επόμενο</button>
                <button id="submitBtn" onclick="submitQuiz()" class="hidden">Υποβολή</button>
            </div>
        </div>

        <div id="resultContainer" class="hidden result">
            <h2>🎉 Αποτελέσματα</h2>
            <div class="score" id="score"></div>
            <div class="result-message" id="resultMessage"></div>
            <button onclick="restartQuiz()">Ξανά από την Αρχή</button>
        </div>
    </div>

    <script>
        let questions = [];
        let currentQuestion = 0;
        let userAnswers = [];

        // Load CSV file on page load
        window.addEventListener('DOMContentLoaded', function() {
            loadCSV();
        });

        function loadCSV() {
            fetch('questions.csv')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Το αρχείο δεν βρέθηκε');
                    }
                    return response.text();
                })
                .then(csv => {
                    parseCSV(csv);
                    startQuiz();
                })
                .catch(error => {
                    console.error('Σφάλμα φόρτωσης CSV:', error);
                    document.getElementById('loading').innerHTML = '<p style="color: red;">❌ Σφάλμα φόρτωσης ερωτήσεων. Βεβαιωθείτε ότι το questions.csv βρίσκεται στον ίδιο φάκελο.</p>';
                });
        }

        function parseCSV(csv) {
            const lines = csv.trim().split('\n');
            questions = [];
            
            for (let i = 1; i < lines.length; i++) {
                const parts = lines[i].split(';');
                if (parts.length >= 7) {
                    questions.push({
                        question: parts[0].trim(),
                        options: [
                            parts[1].trim(),
                            parts[2].trim(),
                            parts[3].trim(),
                            parts[4].trim()
                        ],
                        correct: parseInt(parts[5].trim()),
                        fact: parts[6].trim()
                    });
                }
            }
        }

        function startQuiz() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('quizContainer').classList.remove('hidden');
            currentQuestion = 0;
            userAnswers = new Array(questions.length).fill(null);
            displayQuestion();
        }

        function displayQuestion() {
            const q = questions[currentQuestion];
            const questionArea = document.getElementById('questionArea');
            
            let html = '<div class="question-container">';
            html += `<div class="question">Ερώτηση ${currentQuestion + 1} από ${questions.length}</div>`;
            html += `<div class="question">${q.question}</div>`;
            html += '<div class="options">';
            
            q.options.forEach((option, index) => {
                html += `
                    <div class="option" onclick="checkAnswer(${index})" data-index="${index}">
                        <input type="radio" id="option${index}" name="answer" value="${index}">
                        <label for="option${index}">${option}</label>
                    </div>
                `;
            });
            
            html += '</div>';
            html += '<div id="feedback"></div>';
            html += '</div>';
            questionArea.innerHTML = html;
            
            updateProgress();
            updateButtons();
        }

        function checkAnswer(selectedIndex) {
            const q = questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const selectedOption = options[selectedIndex];
            const radio = selectedOption.querySelector('input[type="radio"]');
            
            // Disable all options after selection
            options.forEach(opt => {
                opt.style.pointerEvents = 'none';
            });
            
            // Check radio
            radio.checked = true;
            
            if (selectedIndex === q.correct) {
                // Correct answer
                selectedOption.classList.add('correct');
                userAnswers[currentQuestion] = selectedIndex;
                
                feedback.innerHTML = `<div class="fact">💡 ${q.fact}</div>`;
                
                // Enable next button
                document.getElementById('nextBtn').disabled = false;
                document.getElementById('submitBtn').disabled = false;
            } else {
                // Wrong answer
                selectedOption.classList.add('wrong');
                feedback.innerHTML = `<div class="error-message">❌ Λάθος! Δοκίμασε ξανά.</div>`;
                
                // Re-enable options after animation
                setTimeout(() => {
                    selectedOption.classList.remove('wrong');
                    options.forEach(opt => {
                        opt.style.pointerEvents = 'auto';
                    });
                    radio.checked = false;
                    feedback.innerHTML = '';
                }, 1000);
            }
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1 && userAnswers[currentQuestion] !== null && userAnswers[currentQuestion] !== undefined) {
                currentQuestion++;
                displayQuestion();
                
                // Disable next/submit until correct answer
                if (userAnswers[currentQuestion] === null || userAnswers[currentQuestion] === undefined) {
                    document.getElementById('nextBtn').disabled = true;
                    document.getElementById('submitBtn').disabled = true;
                }
            }
        }

        function previousQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                displayQuestion();
                
                // If question was already answered, show the correct answer and fact
                if (userAnswers[currentQuestion] !== null && userAnswers[currentQuestion] !== undefined) {
                    const q = questions[currentQuestion];
                    const options = document.querySelectorAll('.option');
                    const correctOption = options[q.correct];
                    
                    correctOption.classList.add('correct');
                    correctOption.querySelector('input[type="radio"]').checked = true;
                    
                    document.getElementById('feedback').innerHTML = `<div class="fact">💡 ${q.fact}</div>`;
                    
                    // Disable all options
                    options.forEach(opt => {
                        opt.style.pointerEvents = 'none';
                    });
                    
                    document.getElementById('nextBtn').disabled = false;
                    document.getElementById('submitBtn').disabled = false;
                }
            }
        }

        function updateButtons() {
            document.getElementById('prevBtn').disabled = currentQuestion === 0;
            
            // Disable next/submit if current question not answered
            const isAnswered = userAnswers[currentQuestion] !== null && userAnswers[currentQuestion] !== undefined;
            
            if (currentQuestion === questions.length - 1) {
                document.getElementById('nextBtn').classList.add('hidden');
                document.getElementById('submitBtn').classList.remove('hidden');
                document.getElementById('submitBtn').disabled = !isAnswered;
            } else {
                document.getElementById('nextBtn').classList.remove('hidden');
                document.getElementById('submitBtn').classList.add('hidden');
                document.getElementById('nextBtn').disabled = !isAnswered;
            }
        }

        function updateProgress() {
            const progress = ((currentQuestion + 1) / questions.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }

        function submitQuiz() {
            document.getElementById('quizContainer').classList.add('hidden');
            document.getElementById('resultContainer').classList.remove('hidden');
            document.getElementById('score').textContent = '🎉';
            document.getElementById('resultMessage').textContent = 'Συγχαρητήρια! Ολοκλήρωσες με επιτυχία το quiz!';
        }

        function restartQuiz() {
            document.getElementById('resultContainer').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');
            questions = [];
            currentQuestion = 0;
            userAnswers = [];
            loadCSV();
        }
    </script>
</body>
</html>
